# Namespace definition
apiVersion: v1
kind: Namespace
metadata:
  name: documentdb-preview-ns
  labels:
    istio-injection: enabled

---

apiVersion: security.istio.io/v1
kind: PeerAuthentication
metadata:
  name: cnpg-metrics-permissive
  namespace: documentdb-preview-ns
spec:
  selector:
    matchLabels:
      cnpg.io/podRole: instance
  mtls:
    mode: STRICT
  portLevelMtls:
    "9187":
      mode: PERMISSIVE
    "8000":
      mode: PERMISSIVE

---

apiVersion: v1
kind: Secret
metadata:
  name: documentdb-credentials
  namespace: documentdb-preview-ns
type: Opaque
data:
  username: ZG9jZGI=
  password: {{DOCUMENTDB_PASSWORD_BASE64}}

---

apiVersion: documentdb.io/preview
kind: DocumentDB
metadata:
  name: documentdb-preview
  namespace: documentdb-preview-ns
spec:
  documentDBVersion: "{{DOCUMENTDB_VERSION}}"
  documentDbCredentialSecret: documentdb-credentials
  nodeCount: 1
  instancesPerNode: 1
  resource:
    storage:
      pvcSize: 10Gi
  clusterReplication:
    # PostgreSQL replication travels inside the Istio mTLS boundary.
    disableTLS: true
    highAvailability: true
    primary: {{PRIMARY_CLUSTER}}
    crossCloudNetworkingStrategy: Istio
    clusterList:
{{CLUSTER_LIST}}
  exposeViaService:
    serviceType: LoadBalancer
  logLevel: info

---

apiVersion: placement.kubernetes-fleet.io/v1beta1
kind: ClusterResourcePlacement
metadata:
  name: documentdb-crp
spec:
  resourceSelectors:
    - group: ""
      version: v1
      kind: Namespace
      name: documentdb-preview-ns
  policy:
    placementType: PickFixed
    clusterNames:
{{PLACEMENT_LIST}}
  strategy:
    type: RollingUpdate