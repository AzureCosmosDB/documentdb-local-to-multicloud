services:
  documentdb:
    image: ghcr.io/documentdb/documentdb/documentdb-local:latest
    container_name: documentdb-local
    environment:
      USERNAME: demo
      PASSWORD: demo
      SKIP_INIT_DATA: "true"
    ports:
      - "27017:10260"
    restart: unless-stopped

  seed-listings:
    # Loads the bookings/listings demo dataset (matches data/load-data.sh).
    # Targets: bookingsdb.listings from data/listings_vectors.json (~30 MB,
    # includes the 1536-dim descriptionVector field used by the vector demo).
    # Also creates the cosmosSearch vector index + supporting query indexes
    # so the local demo matches the multi-cloud setup out of the box.
    build:
      context: ./docker/seed
    depends_on:
      - documentdb
    environment:
      # Container-to-container endpoint (not the host-mapped 27017)
      MONGODB_URI: mongodb://demo:demo@documentdb:10260/?tls=true&tlsAllowInvalidCertificates=true
      MONGODB_DB: bookingsdb
      MONGODB_COLLECTION: listings
      DATA_FILE: /data/listings_vectors.json
      SEED_ONLY_IF_EMPTY: "true"
      DROP_COLLECTION: "false"
      BATCH_SIZE: "500"
      CREATE_INDEXES: "true"
      VECTOR_FIELD: "descriptionVector"
      VECTOR_DIMENSIONS: "1536"
    volumes:
      - ./data:/data:ro
    restart: "no"
